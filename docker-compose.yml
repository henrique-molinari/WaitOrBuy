name: waitorbuy
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waitorbuy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waitorbuy}
      POSTGRES_DB: ${POSTGRES_DB:-waitorbuy}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 10s
      retries: 20

  firebase:
    build: ./firebase
    ports: ["8080:8080", "9099:9099"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ >/dev/null && curl -sf http://localhost:9099/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      mongo: {condition: service_healthy}
      firebase: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  etl-runner:
    build: .
    command: python -m etl.runner
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      mongo: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/etl_alive"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
  mongodata:
