name: waitorbuy
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waitorbuy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waitorbuy}
      POSTGRES_DB: ${POSTGRES_DB:-waitorbuy}
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7
    ports: ["127.0.0.1:27018:27017"]
    volumes: [mongodata:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 10s
      retries: 20

  firebase:
    profiles: [emulator]   # só sobe com: docker compose --profile emulator up
    build: ./firebase
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:9099:9099"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ >/dev/null && curl -sf http://localhost:9099/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    volumes: ["./firebase/credentials.json:/run/secrets/firebase.json:ro"]
    ports: ["127.0.0.1:8001:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      mongo: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  etl-runner:
    build: .
    command: python -m etl.runner
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      mongo: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/etl_alive"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  pgdata:
  mongodata:
