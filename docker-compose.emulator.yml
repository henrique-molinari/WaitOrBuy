# Modo EMULADOR (sem tocar no Firebase real; é o padrão de um clone novo, pelo .env.example).
# Também usado por scripts/test_emulator.sh e scripts/e2e.sh, que o ativam à força com -f e --profile emulator. O backend fala com o Auth/Firestore Emulator em vez do projeto real.
services:
  backend:
    environment:
      FIREBASE_PROJECT_ID: demo-waitorbuy
      FIREBASE_CREDENTIALS: ""
      FIREBASE_AUTH_EMULATOR_HOST: firebase:9099
      FIRESTORE_EMULATOR_HOST: firebase:8080
    depends_on:
      firebase: {condition: service_healthy}
